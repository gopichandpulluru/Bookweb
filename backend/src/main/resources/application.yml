spring:
  application:
    name: shopease
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shopease}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

app:
  jwt:
    # Base64 encoded, at least 32 bytes. Override with JWT_SECRET outside dev!
    secret: ${JWT_SECRET:c2hvcGVhc2UtZGV2LXNlY3JldC1rZXktY2hhbmdlLWluLXByb2R1Y3Rpb24tMDEyMzQ1Njc4OQ==}
    expiration-ms: 86400000        # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
    currency: inr
  mail:
    from: no-reply@shopease.local
  redis:
    enabled: false                 # set true to turn on the Redis cache manager
  inventory:
    low-stock-threshold: 5
  admin:
    email: ${ADMIN_EMAIL:admin@shopease.com}
    password: ${ADMIN_PASSWORD:Admin@12345}   # dev default - change it!
    alert-email: ${ADMIN_ALERT_EMAIL:admin@shopease.com}
